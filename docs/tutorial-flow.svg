<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="580" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="700" fill="#1f2937">Request flow &amp; where each control runs</text>

  <!-- legend -->
  <rect x="566" y="20" width="240" height="22" rx="6" fill="#fbfbfd" stroke="#e5e7eb"/>
  <rect x="576" y="26" width="11" height="11" rx="3" fill="#eaf1fb" stroke="#3b6cb7"/><text x="592" y="35" font-size="10" fill="#374151">edge</text>
  <rect x="628" y="26" width="11" height="11" rx="3" fill="#fff7e6" stroke="#d79b00"/><text x="644" y="35" font-size="10" fill="#374151">Lambda</text>
  <rect x="700" y="26" width="11" height="11" rx="3" fill="#f3eefa" stroke="#7e57c2"/><text x="716" y="35" font-size="10" fill="#374151">data / model</text>

  <!-- ===== request spine (left) ===== -->
  <rect x="130" y="56" width="140" height="34" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="200" y="77" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Client</text>

  <rect x="110" y="120" width="180" height="44" rx="8" fill="#eaf1fb" stroke="#3b6cb7" stroke-width="1.5"/>
  <text x="200" y="139" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">WAF</text>
  <text x="200" y="153" font-size="9.5" fill="#6b7280" text-anchor="middle">IP allow-list · rate limit</text>

  <rect x="100" y="194" width="200" height="48" rx="8" fill="#eaf1fb" stroke="#3b6cb7" stroke-width="1.5"/>
  <text x="200" y="213" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">API Gateway (REST)</text>
  <text x="200" y="228" font-size="9.5" fill="#6b7280" text-anchor="middle">API key · access logs · request_id</text>

  <!-- chat Lambda with 5 steps -->
  <rect x="60" y="286" width="320" height="172" rx="8" fill="#fff7e6" stroke="#d79b00" stroke-width="1.5"/>
  <text x="74" y="307" font-size="13" font-weight="700" fill="#1f2937">Lambda: chat</text>
  <text x="186" y="307" font-size="9" fill="#9ca3af">src/chat/handler.py</text>
  <text x="74" y="331" font-size="11" fill="#374151">1 · network / identity check</text>
  <rect x="68" y="339" width="304" height="20" rx="4" fill="#fef3c7"/>
  <text x="74" y="353" font-size="11" font-weight="700" fill="#b45309">2 · authorize at retrieval (clearance vs classification)  ◄ core fix</text>
  <text x="74" y="377" font-size="11" fill="#374151">3 · injection scan of retrieved content (quarantine)</text>
  <text x="74" y="399" font-size="11" fill="#374151">4 · Bedrock Converse + Guardrail</text>
  <text x="74" y="421" font-size="11" fill="#374151">5 · emit 3 correlated logs — one request_id</text>
  <text x="74" y="445" font-size="9.5" fill="#9ca3af">order matters: an unauthorized doc is stopped at step 2, before the model</text>

  <!-- data / model -->
  <rect x="60" y="500" width="160" height="46" rx="8" fill="#f3eefa" stroke="#7e57c2" stroke-width="1.5"/>
  <text x="140" y="520" font-size="11.5" font-weight="700" fill="#1f2937" text-anchor="middle">Bedrock + Guardrail</text>
  <text x="140" y="535" font-size="9.5" fill="#6b7280" text-anchor="middle">prompt-attack · PII · topics</text>

  <rect x="240" y="500" width="140" height="46" rx="8" fill="#f3eefa" stroke="#7e57c2" stroke-width="1.5"/>
  <text x="310" y="520" font-size="11.5" font-weight="700" fill="#1f2937" text-anchor="middle">S3 corpus</text>
  <text x="310" y="535" font-size="9.5" fill="#6b7280" text-anchor="middle">classified · KMS</text>

  <!-- ===== detection column (right) ===== -->
  <rect x="560" y="194" width="200" height="48" fill="#f3f4f6"/>
  <line x1="560" y1="194" x2="760" y2="194" stroke="#6b7280" stroke-width="1.6"/>
  <line x1="560" y1="242" x2="760" y2="242" stroke="#6b7280" stroke-width="1.6"/>
  <text x="660" y="214" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">CloudWatch Logs</text>
  <text x="660" y="229" font-size="9.5" fill="#6b7280" text-anchor="middle">api_access · chat · retrieval</text>

  <rect x="560" y="286" width="200" height="48" rx="8" fill="#fff7e6" stroke="#d79b00" stroke-width="1.5"/>
  <text x="660" y="306" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">Lambda: detector</text>
  <text x="660" y="321" font-size="9.5" fill="#6b7280" text-anchor="middle">4 detections</text>

  <rect x="585" y="372" width="150" height="42" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="660" y="397" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">CloudWatch Alarms</text>

  <rect x="585" y="444" width="150" height="42" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="660" y="469" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">SNS</text>

  <!-- ===== arrows ===== -->
  <line x1="200" y1="90" x2="200" y2="118" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="164" x2="200" y2="192" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="242" x2="200" y2="284" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="458" x2="140" y2="498" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="270" y1="458" x2="305" y2="498" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- chat -> logs -->
  <polyline points="380,330 470,330 470,218 558,218" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="392" y="322" font-size="9.5" fill="#9ca3af">3 logs</text>
  <!-- detection chain -->
  <line x1="660" y1="242" x2="660" y2="284" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="667" y="268" font-size="9.5" fill="#9ca3af">subscription filter</text>
  <line x1="660" y1="334" x2="660" y2="370" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="667" y="357" font-size="9.5" fill="#9ca3af">PutMetricData</text>
  <line x1="660" y1="414" x2="660" y2="442" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
